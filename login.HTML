    <script src="particles.js"></script>
    
    <script>
function animateCard(cardId) {
    const card = document.getElementById(cardId);
    card.style.opacity = "0";
    card.style.transform = "translateY(80px)";

    setTimeout(() => {
        card.style.transition = "all 0.6s ease";
        card.style.opacity = "1";
        card.style.transform = "translateY(0)";
    }, 50);
}

function showRegister() {
    document.getElementById('loginCard').classList.add('hidden');
    const reg = document.getElementById('registerCard');
    reg.classList.remove('hidden');
    animateCard('registerCard');
}

function showLogin() {
    document.getElementById('registerCard').classList.add('hidden');
    const log = document.getElementById('loginCard');
    log.classList.remove('hidden');
    animateCard('loginCard');
}
        // --- LÓGICA DE INTERFAZ ---
        function showRegister() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }

        // --- LÓGICA DE REGISTRO (Guardar en LocalStorage) ---
        const registerForm = document.getElementById('registerForm');

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUsername').value;
            const pass = document.getElementById('regPassword').value;

            // Obtener usuarios ya existentes o crear lista vacía
            let usuarios = JSON.parse(localStorage.getItem('usuarios_cecyteam')) || [];

            // Verificar si el usuario ya existe
            const existe = usuarios.find(u => u.username === user);
            if (existe) {
                alert("Ese nombre de usuario ya está ocupado.");
                return;
            }

            // Guardar nuevo usuario
            usuarios.push({ nombreReal: name, username: user, password: pass });
            localStorage.setItem('usuarios_cecyteam', JSON.stringify(usuarios));

            alert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.");
            showLogin();
        });

        // --- LÓGICA DE LOGIN (Buscar en LocalStorage) ---
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const userVal = document.getElementById('loginUsername').value;
            const passVal = document.getElementById('loginPassword').value;

            // Obtener lista de usuarios de la memoria
            let usuarios = JSON.parse(localStorage.getItem('usuarios_cecyteam')) || [];

            // Agregar a JUAN por defecto si la lista está vacía (Opcional)
            if (userVal === "JUAN" && passVal === "1234") {
                sessionStorage.setItem('usuarioNombre', "JUAN");
                window.location.href = 'index.html';
                return;
            }

            // Buscar coincidencia
            const usuarioEncontrado = usuarios.find(u => u.username === userVal && u.password === passVal);

            if (usuarioEncontrado) {
                // Guardamos el nombre real para el saludo "HOLA, JUAN"
                sessionStorage.setItem('usuarioNombre', usuarioEncontrado.nombreReal); 
                window.location.href = 'index.html'; 
            } else {
                alert("Usuario o contraseña incorrectos");
            }
        });
        function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
